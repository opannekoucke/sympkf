[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "sympkf"
authors = [
  {name = "Olivier Pannekoucke", email = "olivier.pannekoucke@meteo.fr"},
]
maintainers = [
  {name = "Olivier Pannekoucke", email = "olivier.pannekoucke@meteo.fr"}
]

description = "Symbolic Calculation for the Parametric Dynamics"
keywords = [ "data assimilation", "parametric kalman filter", "computer algebra" ]

license = { file = "LICENSE" }

requires-python = ">=3.12"

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: CeCILL-B Free Software License Agreement (CECILL-B) ",
    "Operating System :: OS Independent",  
]

dynamic = [ "version" ]
dependencies = [
    "sympy",
    "numpy",
    "jinja2",
    "matplotlib>=3.11.1",
    "pip>=26.2.1",
    "ipykernel>=7.3.0",
]

urls.Documentation = "https://github.com/opannekoucke/sympkf/"
urls.Homepage = "https://github.com/opannekoucke/sympkf/"
urls.Issues = "https://github.com/opannekoucke/sympkf/"
urls.Repository = "https://github.com/opannekoucke/sympkf/"

