[build-system]
requires = [ "setuptools>=60", "setuptools-scm>=8" ]
build-backend = "setuptools.build_meta"

[project]
name = "sympkf"
authors = [
  {name = "Olivier Pannekoucke", email = "olivier.pannekoucke@meteo.fr"},
]

description = "Symbolic Calculation for the Parametric Dynamics"
readme = "README.md"
keywords = [ "data assimilation", "parametric kalman filter", "computer algebra" ]

license-files = ["CeCILL-B Free Software License Agreement (CECILL-B)", "LICENCE.txt"]

requires-python = ">=3.12"

classifiers = [
    "Programming Language :: Python :: 3",    
    "Operating System :: OS Independent",  
]

dynamic = [ "version" ]
dependencies = [
    "sympy",
    "numpy",
    "jinja2",
    "matplotlib>=3.11.1",
    "pip>=26.2.1",
    "ipykernel>=7.3.0",
]

urls.Documentation = "https://github.com/opannekoucke/sympkf/"
urls.Homepage = "https://github.com/opannekoucke/sympkf/"
urls.Issues = "https://github.com/opannekoucke/sympkf/"
urls.Repository = "https://github.com/opannekoucke/sympkf/"

[tool.setuptools]
# 2. On indique à setuptools que le code source se trouve dans le dossier 'src'
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = {attr = "sympkf.__version__"}

